<div class="min-h-screen bg-base-100 flex flex-col">
  <!-- Navbar -->
  <div class="navbar bg-base-100 border-b border-base-300 px-4 md:px-8 sticky top-0 z-50">
    <div class="flex-1">
      <a routerLink="/" class="btn btn-ghost text-2xl font-black tracking-tighter">
        DARK<span class="text-primary">STAR</span>
      </a>
    </div>
    <div class="flex-none gap-2">
      <ul class="menu menu-horizontal px-1 font-bold">
        <li>
          <a
            routerLink="/"
            routerLinkActive="text-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            >Home</a
          >
        </li>
        <li><a routerLink="/hall-of-flame" routerLinkActive="text-primary">Hall of Flame</a></li>
      </ul>
      <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-primary btn-sm md:btn-md">Join Clan</label>
        <ul
          tabindex="0"
          class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52 border border-base-300"
        >
          <li><a href="https://discord.gg/darkstar" target="_blank">Discord Server</a></li>
          <li><a>Recruitment Info</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer footer-center p-10 bg-base-200 text-base-content border-t border-base-300">
    <aside>
      <div class="text-2xl font-black tracking-tighter mb-2">
        DARK<span class="text-primary">STAR</span>
      </div>
      <p class="font-bold opacity-60">Elite Gaming Community since 2024</p>
      <p class="opacity-40 text-xs mt-4 uppercase tracking-widest">
        &copy; 2026 DarkStar Clan • Built with Nx & Angular
      </p>
    </aside>
    <nav>
      <div class="grid grid-flow-col gap-4">
        <a class="link link-hover">Twitter</a>
        <a class="link link-hover">YouTube</a>
        <a class="link link-hover">Discord</a>
      </div>
    </nav>
  </footer>
</div>
