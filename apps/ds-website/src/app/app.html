<!-- Mobile hamburger button -->
<button
  class="lg:hidden fixed top-4 left-4 z-[60] w-10 h-10 flex items-center justify-center rounded bg-base-200/80 border border-base-300 backdrop-blur-sm"
  (click)="toggleSidebar()"
  aria-label="Toggle navigation menu"
>
  @if (sidebarOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  }
</button>

<!-- Sidebar overlay (mobile) -->
@if (sidebarOpen()) {
  <div
    class="lg:hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40"
    (click)="closeSidebar()"
  ></div>
}

<!-- Vertical Sidebar -->
<aside
  class="sidebar-nav"
  [class.sidebar-open]="sidebarOpen()"
>
  <!-- Logo -->
  <a routerLink="/" class="sidebar-logo" (click)="closeSidebar()">
    <span class="text-primary">DARK</span><span class="text-base-content">STAR</span>
  </a>

  <!-- Nav Links -->
  <nav class="sidebar-links">
    <a
      routerLink="/"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-link"
      (click)="closeSidebar()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>HOME</span>
    </a>
    <a
      routerLink="/hall-of-flame"
      routerLinkActive="sidebar-link-active"
      class="sidebar-link"
      (click)="closeSidebar()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
      </svg>
      <span>HALL OF FLAME</span>
    </a>
  </nav>

  <!-- Social Links -->
  <div class="sidebar-socials">
    <a href="https://discord.gg/darkstar" target="_blank" rel="noopener noreferrer" class="sidebar-social" aria-label="Discord">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286z"/>
      </svg>
    </a>
    <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="sidebar-social" aria-label="YouTube">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"></path>
        <path d="m10 15 5-3-5-3z"></path>
      </svg>
    </a>
    <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="sidebar-social" aria-label="Twitter">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
  </div>
</aside>

<!-- Main Content Area -->
<div class="main-content">
  <router-outlet></router-outlet>
</div>
