services:
  # === DISCORD BOT (Background Worker - Always ON 24/7) ===
  - type: worker
    name: ewlya-bot
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod:bot
    # Environment variables are managed by Doppler integration
    # Doppler auto-syncs all secrets to this service

  # === NESTJS API (Web Service) ===
  - type: web
    name: ewlya-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod:api
    # Environment variables are managed by Doppler integration
    # Doppler auto-syncs all secrets to this service
