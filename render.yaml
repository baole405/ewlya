services:
  # === COMBINED: API + Bot in one Web Service (FREE tier) ===
  - type: web
    name: ewlya
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run db:safe-seed:prod && npm run start:prod:combined
    healthCheckPath: /health
    # Environment variables are managed by Doppler integration
    # Doppler auto-syncs all secrets to this service
