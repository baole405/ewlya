services:
  postgres:
    image: postgres:16-alpine
    container_name: darkstar-postgres
    environment:
      POSTGRES_USER: ds_user
      POSTGRES_PASSWORD: ds_password
      POSTGRES_DB: darkstar_db
    ports:
      - "5488:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
