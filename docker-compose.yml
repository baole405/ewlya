services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ewlya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ewlya}
    ports:
      - "8888:5432"
    volumes:
      - ewlya-db-data:/var/lib/postgresql/data
    networks:
      - ewlya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewlya-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${SUPABASE_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public}
      - DIRECT_URL=${SUPABASE_DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public}
      - DISABLE_BOT_CLIENT=true
    ports:
      - "3333:3000"
    volumes:
      # Map riêng lẻ để TRÁNH file .env lọt vào
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./dist:/app/dist
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ewlya-network
    command: sh -c "npm install --include=dev && npm run start:dev:api"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewlya-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${SUPABASE_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public}
      - DIRECT_URL=${SUPABASE_DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public}
      - IS_LOCAL_BOT=true
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./dist:/app/dist
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ewlya-network
    command: sh -c "npm install --include=dev && npm run start:dev:bot"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ewlya-network:
    driver: bridge

volumes:
  ewlya-db-data:
    driver: local
