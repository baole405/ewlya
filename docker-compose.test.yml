services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:pass@localhost:5432/db?sslmode=disable
      - JWT_SECRET=smoke-test-secret
      - DISCORD_CLIENT_ID=mock
      - DISCORD_CLIENT_SECRET=mock
      - DISCORD_CALLBACK_URL=http://localhost:3000/callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/members"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
