name: 🧪 Run Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 🧪 Jest Affected Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: 🔐 Setup Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: ⚙️ Prisma Generate
        run: npx prisma generate --schema=libs/shared/db/prisma/schema.prisma

      - name: 🧪 Nx Affected Test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "${{ secrets.DOPPLER_TOKEN }}" ]; then
            doppler run -- npx nx affected -t test --parallel=3
          else
            npx nx affected -t test --parallel=3
          fi
