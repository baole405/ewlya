name: 🏗️ Ephemeral Staging

on:
  pull_request:

jobs:
  smoke-test:
    name: 🏗️ Stress & Smoke Test (Docker 4x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Install Doppler CLI
        run: |
          (curl -Ls https://get.doppler.com/gui/install.sh || wget -qO- https://get.doppler.com/gui/install.sh) | sudo sh

      - name: 🌀 Build Stress Test (4x Loop)
        run: |
          for i in {1..4}; do
            echo "Build attempt $i/4..."
            docker build -t darkstar-api:stress -f Dockerfile.api .
          done

      - name: 💨 Smoke Test (Docker Compose)
        run: |
          # Start Ephemeral Env
          docker-compose -f docker-compose.test.yml up -d
          
          # Wait for Healthcheck
          echo "Waiting for API Healthcheck..."
          sleep 15
          
          # Check Status
          if docker inspect smoke-test-api-1 | grep -q '"Status": "healthy"'; then
            echo "✅ Ephemeral environment is healthy!"
            docker-compose -f docker-compose.test.yml down
          else
            echo "❌ Smoke test failed: API is not healthy!"
            docker logs smoke-test-api-1
            docker-compose -f docker-compose.test.yml down
            exit 1
          fi
