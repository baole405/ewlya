name: 🏗️ Ephemeral Staging

on:
  pull_request:

jobs:
  smoke-test:
    name: 🏗️ Stress & Smoke Test (Docker 4x)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Setup Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: 💨 Smoke Test (Docker Compose)
        run: |
          # Start Ephemeral Env
          docker compose -f docker-compose.test.yml up -d --build
          
          # Dynamic detect container name
          CONTAINER_NAME=$(docker ps --filter "ancestor=darkstar-api:stress" --format "{{.Names}}")
          echo "Detected container: $CONTAINER_NAME"

          # Sync Database Schema
          echo "Syncing Prisma Schema to Ephemeral DB..."
          docker exec $CONTAINER_NAME npx prisma db push --schema=libs/shared/db/prisma/schema.prisma --skip-generate
          
          # Wait for API to settle after sync
          echo "Waiting for API startup..."
          sleep 15
          
          # Show running containers for debug
          docker ps
          
          # Check Status
          if [ -n "$CONTAINER_NAME" ] && docker inspect "$CONTAINER_NAME" | grep -q '"Status": "healthy"'; then
            echo "✅ Ephemeral environment is healthy!"
            docker compose -f docker-compose.test.yml down
          else
            echo "❌ Smoke test failed: API is not healthy!"
            [ -n "$CONTAINER_NAME" ] && docker logs "$CONTAINER_NAME"
            # Log DB as well if API failed
            DB_NAME=$(docker ps -a --filter "name=db" --format "{{.Names}}")
            [ -n "$DB_NAME" ] && docker logs "$DB_NAME"
            docker compose -f docker-compose.test.yml down
            exit 1
          fi
