name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      
      - name: 🔐 Install Doppler CLI
        run: |
          (curl -Ls https://get.doppler.com/gui/install.sh || wget -qO- https://get.doppler.com/gui/install.sh) | sudo sh

      - uses: nrwl/nx-set-shas@v4

      - name: ⚙️ Prisma Generate
        run: npx prisma generate --schema=libs/shared/db/prisma/schema.prisma

      - name: 🚀 Nx Affected Check (Intelligent Pipeline)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "${{ secrets.DOPPLER_TOKEN }}" ]; then
            doppler run -- npx nx affected -t lint test build --parallel=3
          else
            npx nx affected -t lint test build --parallel=3
          fi

  stress-test:
    name: 🏗️ Stress & Smoke Test (Docker 4x)
    needs: main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Install Doppler CLI
        run: |
          (curl -Ls https://get.doppler.com/gui/install.sh || wget -qO- https://get.doppler.com/gui/install.sh) | sudo sh
      - name: 🌀 Build Stress Test (4x Loop)
        run: |
          for i in {1..4}; do
            echo "Build attempt $i/4..."
            docker build -t darkstar-api:stress -f Dockerfile.api .
          done
      - name: 💨 Smoke Test (Production Readiness)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          docker run -d --name smoke-test -p 3000:3000 \
            -e DATABASE_URL="mock" -e JWT_SECRET="test" \
            darkstar-api:stress
          sleep 10
          if curl -s localhost:3000/api/members > /dev/null; then
            echo "✅ Smoke test passed!"
            docker stop smoke-test && docker rm smoke-test
          else
            echo "❌ Smoke test failed!"
            docker logs smoke-test
            exit 1
          fi
