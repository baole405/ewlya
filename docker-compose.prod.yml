version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ewlya-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ewlya}
    volumes:
      - ewlya-db-data-prod:/var/lib/postgresql/data
    networks:
      - ewlya-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewlya-migrate
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ewlya-network-prod
    command: npx prisma migrate deploy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewlya-api-prod
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ewlya-network-prod
    command: npm run start:prod:api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewlya-bot-prod
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ewlya}?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ewlya-network-prod
    command: npm run start:prod:bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ewlya-network-prod:
    driver: bridge

volumes:
  ewlya-db-data-prod:
    driver: local
